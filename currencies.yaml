# yaml-language-server: $schema=schemas/currencies-schema.yaml
---
schema_version: 1.1.0
# ISO 4217 active codes (List One) as first-class entities, verified against
# the ISO 4217 list one (178 codes: national currencies, funds and units of
# account, precious-metal codes, bond-market units, supranationals, and the
# test/no-currency codes XXX/XTS), with ISO numeric identifiers.
# Currency is a denomination, not a physical unit: every code is its own
# base (no root_units, never a cross-currency conversion factor — exchange
# rates float, and a unitsml-style factor table would silently compute
# wrong money). All codes share the currency dimension (d:currency) so
# monetary rates compose dimensionally (cur:EUR / u:liter).
currencies:
- identifiers:
  - type: iso4217
    id: AED
  - type: iso4217_numeric
    id: "784"
  - type: unitsml
    id: cur:AED
  names:
  - value: "United Arab Emirates dirham"
    lang: en
  minor_unit_exponent: 2
  status: active
  unit_system_reference:
  - type: unitsml
