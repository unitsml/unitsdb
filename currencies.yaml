# yaml-language-server: $schema=schemas/currencies-schema.yaml
---
schema_version: 1.0.0
# ISO 4217 active currency codes as first-class entities. Currency is a
# denomination, not a physical unit: every entry is its own base (no
# root_units, never a cross-currency conversion factor — exchange rates
# float, and a unitsml-style factor table would silently compute wrong
# money). All codes share the currency dimension (d:currency) so monetary
# rates compose dimensionally (cur:EUR / u:liter = price per volume).
# Bond-market unit codes (XBA..XBD), metals (XAU/XAG/XPT/XPD — those are
# troy-mass units, not money), test (XTS) and no-currency (XXX) are out
# of scope; historic codes land separately with status: historic.
currencies:
- identifiers:
  - type: iso4217
    id: AED
  - type: unitsml
    id: cur:AED
  names:
  - value: "UAE dirham"
    lang: en
  minor_unit_exponent: 2
  status: active
  unit_system_reference:
  - type: unitsml
    id: us:iso-4217
  quantity_references:
  - type: unitsml
    id: q:monetary_value
